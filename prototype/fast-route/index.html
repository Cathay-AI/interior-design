<style>
:root{
  --paper:#f3eee5;--surface:#fbf9f4;--card:#ece5d8;--ink:#2b2621;--muted:#675d53;--accent:#b5653a;--accent-d:#8f4c2a;
  --green:#5f7a6a;--line:#ded5c6;
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img,svg{max-width:100%;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.note{font-size:14px;color:var(--muted);line-height:1.55}
.lead{font-size:17px;color:#5a5047;line-height:1.6}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}

/* ---------- shell ---------- */
header{position:sticky;top:0;z-index:10;background:rgba(243,238,229,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1160px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.brand svg{width:28px;height:28px}
#steps{flex:1;list-style:none;padding:0;display:flex;gap:6px;justify-content:center;min-width:0}
#steps button{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;color:var(--muted);font-size:14px;white-space:nowrap}
#steps .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--line);color:var(--ink)}
#steps .done{color:var(--ink)}#steps .done .n{background:var(--ink);color:#fff}
#steps .now{background:var(--surface);color:var(--ink);font-weight:700}#steps .now .n{background:var(--accent);color:#fff}
.ghostbtn{font-size:14px;font-weight:600;color:var(--accent-d);padding:8px 12px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
main{flex:1;width:100%;max-width:1160px;margin:0 auto;padding:clamp(20px,5vw,56px) 20px 32px;display:flex;flex-direction:column;gap:20px}
main>*{animation:in .28s ease backwards;min-width:0}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
footer{max-width:1160px;width:100%;margin:0 auto;padding:0 20px 20px;font-size:13px;color:var(--muted)}

.shead{display:grid;gap:8px}
.shead h1{font-size:clamp(26px,4.4vw,38px);line-height:1.25;letter-spacing:-.01em}
.back{justify-self:start;font-size:14px;color:var(--muted);padding:4px 0}
.cta{align-self:flex-start;min-width:220px;min-height:54px;padding:0 28px;border-radius:999px;background:var(--ink);color:#fff;font-size:18px;font-weight:700;transition:transform .12s,opacity .2s}
.cta:active{transform:scale(.98)}.cta:disabled{opacity:.3}
.cta.accent{background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;background:var(--card);font-size:15px;text-align:left}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip.ghost{background:none;border:1px solid var(--line);color:#5a5047}

/* 1 滑卡 */
main[data-step="1"]{max-width:520px;align-items:center}
.deck{position:relative;width:min(100%,calc((100dvh - 250px)*.72));aspect-ratio:18/25;touch-action:pan-y}
.card{position:absolute;inset:0;border-radius:24px;overflow:hidden;background:var(--card);box-shadow:0 14px 40px rgba(43,38,33,.22);user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform}
.card img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.card .meta{position:absolute;left:0;right:0;bottom:0;padding:44px 18px 16px;color:#fff;background:linear-gradient(transparent,rgba(20,16,12,.72));display:grid;gap:6px}
.card .meta b{font-size:24px}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;align-items:center}.card .tags a{margin-left:auto;color:rgba(255,255,255,.75);font-size:12px}
.card.noimg{background:linear-gradient(160deg,#cdbfa9,#8f7f6a)}.card.noimg img{display:none}.card .tags span{background:rgba(255,255,255,.2);border-radius:999px;padding:2px 10px;backdrop-filter:blur(4px)}
.stamp{position:absolute;top:22px;font-size:26px;font-weight:800;letter-spacing:.04em;padding:4px 14px;border:4px solid;border-radius:12px;opacity:0;background:rgba(255,255,255,.12)}
.stamp.like{left:18px;color:#7fd6a0;transform:rotate(-12deg)}.stamp.nope{right:18px;color:#ff9d8a;transform:rotate(12deg)}
.swipebar{display:flex;align-items:center;justify-content:center;gap:28px}
.round{width:68px;height:68px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:30px;box-shadow:0 6px 18px rgba(43,38,33,.12);transition:transform .12s}
.round:active{transform:scale(.92)}.round.nope{color:#b3523a}.round.like{color:#fff;background:var(--accent);border-color:var(--accent)}
.count{font-size:14px;color:var(--muted);min-width:3em;text-align:center}
.link{font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* 2 我家的條件 */
main[data-step="2"]{max-width:720px}
.voice{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 16px}
.voice:focus-within{border-color:var(--accent)}
.voicebody{flex:1;min-width:0;display:grid;gap:4px}
.voice textarea{width:100%;border:none;background:none;outline:none;resize:none;font-size:17px;line-height:1.45;padding:2px 0;field-sizing:content;min-height:1.5em;max-height:6em}
.mic{width:52px;height:52px;flex:none;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(181,101,58,.16);transition:transform .15s}
.mic[aria-pressed="true"]{animation:pulse 1.1s infinite;transform:scale(.94)}
.mic:disabled{background:#b9afa2;box-shadow:none}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(181,101,58,.24)}}
.taste{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;font-size:16px}.taste>*{flex-basis:100%}.chip:disabled{opacity:.5;cursor:default}
.warn{font-size:14px;line-height:1.5;background:#f8e9dd;border:1px solid var(--accent);border-radius:12px;padding:10px 12px;color:#5a3a26}
.meter{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 20px}
.meter .bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.meter .bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s}
.tick{font-size:13px;padding:4px 10px;border-radius:99px;border:1px dashed var(--line);color:var(--muted)}.tick.done{border-style:solid;border-color:var(--green);color:var(--green);font-weight:600}
.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted);position:relative}
.field input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 44px 0 12px;background:#fff;font-size:17px;color:var(--ink)}
.field em{position:absolute;right:10px;bottom:13px;font-style:normal;font-size:12px}
.drop{display:grid;gap:4px;place-items:center;text-align:center;padding:22px 16px;border:2px dashed var(--accent);border-radius:16px;color:var(--accent-d);cursor:pointer}
.drop span{font-size:13px;color:var(--muted)}.drop.over{background:#f8e9dd}
.docs{list-style:none;padding:0;display:grid;gap:8px}
.docs li{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:14px;padding:8px}
.docs img,.docs .pdf{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}.docs .pdf{display:grid;place-items:center;background:var(--ink);color:#fff;font-size:12px;font-weight:700}
.docmeta{flex:1;min-width:0;display:grid;gap:6px}.docmeta b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docs .chip{min-height:30px;padding:2px 10px;font-size:13px}
.docs .rm{width:32px;height:32px;border-radius:50%;background:var(--card);font-size:18px;flex:none}
.err{color:#b3261e;font-size:14px}
.field input[aria-invalid="true"]{border-color:#b3261e;background:#fff6f5}
.send{flex:none;align-self:center;min-height:44px;padding:0 16px;border-radius:999px;background:var(--ink);color:#fff;font-size:15px;font-weight:600}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;cursor:pointer}.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
iframe.printer{position:fixed;width:0;height:0;border:0;visibility:hidden}
/* 文字連結看起來小，但可按範圍撐到 44px，手機好按 */
.link,.back{position:relative}.link::after,.back::after{content:"";position:absolute;inset:-12px -6px}

/* 3 3D */
.result{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:28px;align-items:start}
.stagewrap{display:grid;gap:12px}
.scene{position:relative;aspect-ratio:4/3;max-height:calc(100dvh - 190px);width:100%;border-radius:24px;overflow:hidden;background:#ebe4d8;touch-action:none;cursor:grab}
.scene:active{cursor:grabbing}
.scene canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.scene>svg,.scene>img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hint{position:absolute;right:12px;top:12px;z-index:1;font-size:12px;color:#5a5047;background:rgba(251,249,244,.85);border-radius:999px;padding:4px 10px;pointer-events:none}
.stagebar{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:6px;align-items:center}
.seg button{min-width:48px;height:38px;padding:0 14px;border-radius:999px;background:var(--card);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.panel{display:grid;gap:18px}
.tweak{display:grid;gap:10px}
.pricetag{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.pricetag b{font-size:28px;color:var(--accent)}
.gen{flex:1;display:grid;place-items:center;align-content:center;gap:14px;text-align:center;min-height:50dvh}
.gen .mascot{width:110px;height:110px;animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}

/* 4 估價與施工圖 */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px;align-items:start}
.cardbox{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:12px}
.big{font-size:clamp(34px,6vw,46px);font-weight:700;color:var(--accent);letter-spacing:-.01em}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:2px}
.stepper button{width:36px;height:36px;border-radius:50%;font-size:20px;background:var(--surface)}
.stepper output{min-width:4.2em;text-align:center;font-weight:600}
.items{list-style:none;padding:0;display:grid}
.items li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0}
.items li+li{border-top:1px solid var(--line)}
.items b{font-weight:600}.items .amt{font-weight:600;white-space:nowrap}
.items small{grid-column:1/-1;color:var(--muted);font-size:13px}
.items .bar{grid-column:1/-1;height:5px;border-radius:9px;background:var(--line);position:relative;overflow:hidden}
.items .bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:9px}
.sheets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheetbtn{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fdfdfb;padding:0;aspect-ratio:840/594;display:block;width:100%}
.sheetbtn svg{width:100%;height:100%}
.locked .sheetbtn svg{filter:blur(5px);transform:scale(1.04)}
.badge{justify-self:start;font-size:13px;font-weight:700;color:#5a3a26;background:#f8e9dd;border:1px solid var(--accent);border-radius:999px;padding:3px 12px}
.why{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;min-height:40px}.why .chip{min-height:34px;padding:4px 12px;font-size:14px}
.scene.flat{cursor:default;touch-action:auto}
.stages{list-style:none;padding:0;display:grid;gap:10px}
.stages li{border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.stages li.now{border-color:var(--green);background:#f1f5f0}
.stages p{grid-column:1/-1;font-size:14px;color:#5a5047;line-height:1.55}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--green);color:#fff}.pill.tbd{background:none;border:1px dashed var(--muted);color:var(--muted)}
[hidden]{display:none!important}
.sheetbtn .tag{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:600;background:rgba(43,38,33,.82);color:#fff;border-radius:999px;padding:2px 8px}
.sheetbtn .lock{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;background:rgba(253,253,251,.25)}
.unlockrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cons{list-style:none;padding:0;display:grid;font-size:14px;color:#5a5047}
.cons li{display:flex;gap:10px;align-items:baseline;padding:6px 0}.cons i{width:9px;height:9px;border-radius:50%;flex:none}
.regs{list-style:none;padding:0;display:grid}
.regs li{display:grid;grid-template-columns:5.2em 1fr;gap:12px;padding:12px 0;align-items:start}.regs li+li{border-top:1px solid var(--line)}
.regs .state{font-size:12px;font-weight:700;color:#fff;border-radius:999px;padding:3px 0;text-align:center}
.pitch{text-align:center;font-size:14px;color:var(--muted);line-height:1.5;max-width:30em;margin:0 auto}
.regs small a{color:inherit}.regs .ask{margin-top:8px}.ask input{width:88px;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:16px;background:#fff}
.regbox{border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}.regbox.open{padding-bottom:14px}.regbox #regdetail{padding:0 16px}
.regsum{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 16px;text-align:left;font-size:15px;font-weight:600;line-height:1.45}
.regsum .dot{width:10px;height:10px;border-radius:50%;flex:none;background:#b08a4f}.regsum .dot.need{background:#a8452a}.regsum .dot.no{background:#5f7a6a}
.regsum .chev{margin-left:auto;flex:none;font-size:13px;font-weight:400;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.regs p{font-size:14px;color:#5a5047;line-height:1.6;margin-top:2px}.regs small{font-size:12px;color:var(--muted)}

dialog{margin:auto;border:none;border-radius:22px;padding:0;max-width:min(92vw,420px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(43,38,33,.55)}
.dlg{padding:24px;display:grid;gap:12px}.dlg ul{padding-left:1.2em;line-height:1.8}
dialog.viewer{max-width:min(96vw,1100px);width:100%}dialog.viewer svg{width:100%;height:auto}.viewer .dlg{padding:14px}
.price{font-size:30px;font-weight:700}.price small{font-size:14px;color:var(--muted);font-weight:400}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}.actions a.btn{text-decoration:none;font-size:14px;display:inline-flex;align-items:center}footer a{color:inherit}.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.btn{background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px;font-weight:700}

@media (max-width:820px){
  .hwrap{padding:10px 16px;gap:12px}
  #steps{gap:4px}
  #steps li{flex:1}
  #steps button{display:block;width:100%;padding:0;height:5px;background:var(--line)}
  #steps .n,#steps .t{display:none}
  #steps .done{background:var(--ink)}#steps .now{background:var(--accent)}
  main{padding:20px 16px 24px;gap:16px}
  /* 主要按鈕在手機是一條有底色的固定列；內容在它上方捲動，最後一項也能完整捲到列的上面 */
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .cta{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;min-width:0;box-shadow:0 0 0 14px var(--paper),0 -22px 18px 10px var(--paper)}
  main[data-step="1"]{padding-bottom:24px}
  footer{padding-bottom:calc(100px + env(safe-area-inset-bottom))}body:has(main[data-step="1"]) footer{padding-bottom:20px}
  .result,.two{grid-template-columns:1fr;gap:16px}
  .fields{grid-template-columns:repeat(2,1fr)}
  .scene{aspect-ratio:1;border-radius:20px}
  .sheets{grid-template-columns:repeat(2,1fr)}
  dialog.viewer{max-width:96vw}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="brand" aria-label="回家之前"><svg viewBox="0 0 200 200" aria-hidden="true"><rect x="8" y="8" width="184" height="184" rx="40" fill="#29251f"/><circle cx="100" cy="122" r="58" fill="#ffd98a" opacity=".16"/><path d="M100 28v26" stroke="#d8c9ae" stroke-width="3"/><path d="M68 116a32 32 0 0 0 64 0Z" fill="#fff0cc"/><path d="M100 52C66 52 44 80 41 116H159C156 80 134 52 100 52Z" fill="#a2562d"/><rect x="39" y="114" width="122" height="4.5" rx="2.2" fill="#c9a56a"/></svg><span>回家之前</span></div>
  <ol id="steps" aria-label="進度"></ol>
  <button class="ghostbtn" id="restart" hidden>重新開始</button>
</div></header>
<main id="app" aria-live="polite"></main>
<footer>原型：靈感圖來自 Pinterest，版權屬原作者；金額為參考行情量級；施工圖為 AI 初稿，法規評估為提醒，皆需專業確認。</footer>

<dialog id="unlock"><div class="dlg">
  <h2>解鎖你家尺寸的施工圖初稿</h2>
