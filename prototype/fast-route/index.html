<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>回家之前・快速找風格原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --paper:#ede6da;--screen:#f8f5ee;--card:#ece5d8;--ink:#2b2621;--muted:#8a7f72;--accent:#b5653a;--accent-d:#8f4c2a;
  --green:#5f7a6a;--tan:#c9a77c;--line:#dcd2c2;
  --font:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;
  --serif:"Noto Serif TC","Songti TC",Georgia,serif;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.note{font-size:14px;color:var(--muted);line-height:1.5}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}

/* ---------- page ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1120px;margin:0 auto;padding:14px 20px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700}
.brand svg{width:30px;height:30px}
.ghost{font-size:14px;font-weight:700;color:var(--accent-d);padding:8px 12px;border-radius:999px;border:1px solid var(--line)}
.stage{max-width:1120px;margin:0 auto;padding:8px 20px 32px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:56px;align-items:center}
.story .kicker{font-size:15px;letter-spacing:.2em;font-weight:700;color:var(--accent)}
.story h1{font-family:var(--serif);font-size:clamp(30px,3.6vw,48px);line-height:1.2;margin:10px 0 28px}
#steps{list-style:none;padding:0;display:grid;gap:8px;max-width:420px}
#steps button{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:12px 14px;border-radius:16px;color:var(--muted)}
#steps .n{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--line)}
#steps .t{display:grid;gap:2px}#steps b{font-size:18px}#steps small{font-size:14px}
#steps .done{color:var(--ink)}#steps .done .n{background:var(--ink);border-color:var(--ink);color:#fff}
#steps .now{background:var(--screen);color:var(--ink);box-shadow:0 6px 20px rgba(43,38,33,.08)}
#steps .now .n{background:var(--accent);border-color:var(--accent);color:#fff}
footer{max-width:1120px;margin:0 auto;padding:0 20px 28px;font-size:13px;color:var(--muted)}

/* ---------- phone ---------- */
.phone{width:400px;height:min(800px,calc(100dvh - 130px));min-height:600px;border:12px solid var(--ink);border-radius:48px;background:var(--screen);overflow:hidden;box-shadow:0 30px 60px rgba(43,38,33,.18)}
.screen{height:100%;overflow-y:auto;padding:26px 22px 22px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.screen>*{flex:none;min-width:0}
.shead{display:flex;align-items:center;gap:8px}
.shead h2{font-size:24px;flex:1}
.back{width:36px;height:36px;border-radius:50%;font-size:26px;line-height:1;color:var(--muted);margin-left:-8px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cta{margin-top:auto;position:sticky;bottom:0;z-index:2;box-shadow:0 0 0 10px var(--screen);width:100%;min-height:56px;border-radius:999px;background:var(--ink);color:#fff;font-size:19px;font-weight:700;transition:transform .12s,opacity .2s}
.cta:active{transform:scale(.98)}.cta:disabled{opacity:.35}
.cta.accent{background:var(--accent)}
.link{font-size:14px;font-weight:700;color:var(--accent-d);text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;background:var(--card);font-size:15px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.screen>*{animation:in .28s ease both}

/* entry */
.entry{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;flex:1!important;justify-content:center}
.entry .mascot{width:120px;height:120px}
.door{font-size:22px;font-weight:700;line-height:1.5;margin-bottom:6px}
.routeBtn{width:100%;text-align:left;padding:16px 18px;border-radius:18px;background:var(--card);display:grid;gap:4px}
.routeBtn b{font-size:18px}.routeBtn span{font-size:14px;color:var(--muted)}
.routeBtn.primary{background:var(--ink);color:#fff}.routeBtn.primary span{color:#d8cdbf}
.routeBtn[aria-disabled="true"]{opacity:.6;cursor:default}
.soon{font-size:12px!important;font-weight:700;color:var(--accent)!important;margin-left:8px}

/* 1 新提案 */
.bubble{background:var(--card);border-radius:20px;padding:16px 18px}
.bubble textarea{width:100%;border:none;background:none;resize:none;font-size:20px;line-height:1.55;outline:none}
.micwrap{flex:1!important;display:grid;place-items:center;align-content:center;gap:14px;min-height:190px}
.mic{width:76px;height:76px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 18px rgba(181,101,58,.22),0 0 0 36px rgba(181,101,58,.10);margin:36px;transition:transform .15s}
.mic:active,.mic.on{transform:scale(.94)}
.mic.on{animation:pulse 1.1s infinite}
.mic:disabled{background:var(--muted);box-shadow:0 0 0 18px rgba(138,127,114,.18)}
@keyframes pulse{50%{box-shadow:0 0 0 26px rgba(181,101,58,.28),0 0 0 52px rgba(181,101,58,.10)}}
.miclabel{font-size:18px;color:#5a5047;text-align:center}

/* 2 參考圖 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;padding:0;transition:transform .12s}
.tile svg,.tile img{width:100%;height:100%;object-fit:cover}
.tile .cap{position:absolute;left:8px;bottom:8px;font-size:12px;font-weight:700;background:rgba(248,245,238,.9);border-radius:999px;padding:3px 9px;color:var(--ink)}
.tile[aria-pressed="true"]{box-shadow:0 0 0 4px var(--screen),0 0 0 7px var(--accent)}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:grid;place-items:center}
.tile:active{transform:scale(.97)}
.rm{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;background:rgba(43,38,33,.75);color:#fff;font-size:18px}
.add{display:grid;place-items:center;min-height:54px;border:2px dashed var(--accent);border-radius:14px;color:var(--accent-d);font-size:18px;font-weight:500;cursor:pointer}

/* 3 需求 */
.rows{display:grid;gap:10px}
.rowitem{background:var(--card);border-radius:14px;border:2px solid transparent}
.rowitem.need{background:#f6e6da;border-color:var(--accent)}
.rowbtn{width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;font-size:19px;text-align:left}
.rowbtn .bar{width:1px;height:20px;background:currentColor;opacity:.45}
.rowbtn .v{flex:1}
.need .rowbtn{color:var(--accent-d);font-weight:700}
.editor{padding:0 14px 14px;display:grid;gap:10px}
.editor .chip{background:var(--screen)}.editor .chip[aria-pressed="true"]{background:var(--ink)}
.num{display:flex;align-items:center;gap:8px;margin-top:10px}
.num input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--screen)}

/* 4 3D */
.scene{position:relative;height:300px;perspective:1100px;overflow:hidden;border-radius:20px;background:radial-gradient(circle at 50% 40%,#fffaf0,#eadfcd);touch-action:none;cursor:grab}
.scene:active{cursor:grabbing}
.world{position:absolute;left:50%;top:54%;transform-style:preserve-3d}
.world div{transform-style:preserve-3d}
.world .f{position:absolute;left:0;top:0}
.abc{display:flex;justify-content:center;gap:10px}
.abc button{width:58px;height:40px;border-radius:999px;background:var(--card);font-size:17px;font-weight:500}
.abc button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tweak{display:grid;gap:10px}
.gen{flex:1!important;display:grid;place-items:center;align-content:center;gap:14px;text-align:center}
.gen .mascot{width:110px;height:110px}
.genlist{list-style:none;padding:0;display:grid;gap:8px;text-align:left}
.genlist li{color:var(--muted);padding-left:26px;position:relative}
.genlist li::before{content:"";position:absolute;left:4px;top:.5em;width:10px;height:10px;border-radius:50%;background:var(--line)}
.genlist .on{color:var(--ink);font-weight:700}.genlist .on::before{background:var(--accent)}
.genlist .ok{color:var(--ink)}.genlist .ok::before{background:var(--green)}

/* 5 預算 */
.big{font-size:38px;font-weight:700;color:var(--accent);letter-spacing:.01em}
.big.none{font-size:26px;color:var(--ink)}
.range{position:relative;height:12px;border-radius:999px;background:#ddd5c6;margin:10px 0}
.range i{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--accent)}
.fit{font-size:14px;font-weight:700;color:var(--green)}.fit.partly{color:var(--accent-d)}.fit.over{color:var(--accent)}
.basis{margin-top:8px;font-size:14px;color:#5a5047}.basis summary{cursor:pointer;color:var(--muted)}.basis p{margin-top:6px;line-height:1.6}
.cons{list-style:none;padding:0;display:grid;gap:4px}
.cons summary{display:flex;align-items:center;gap:12px;font-size:19px;padding:8px 0;cursor:pointer;list-style:none}
.cons summary::-webkit-details-marker{display:none}
.cons i{width:16px;height:16px;border-radius:50%;flex:none}
.cons b{font-weight:500;min-width:5.2em}.cons .st{color:#3d362f}
.cons details p{font-size:14px;color:#5a5047;line-height:1.6;padding:0 0 8px 28px}

dialog{border:none;border-radius:22px;padding:0;max-width:min(92vw,420px);background:var(--screen);color:var(--ink)}
dialog::backdrop{background:rgba(43,38,33,.55)}
.dlg{padding:24px;display:grid;gap:12px}.dlg ul{padding-left:1.2em;line-height:1.8}
.lead{color:#5a5047;line-height:1.6}
.actions{display:flex;justify-content:flex-end}.btn{background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px;font-weight:700}

/* ---------- phone-sized viewports: the page is the phone ---------- */
@media (max-width:899px){
  header{padding:10px 16px}
  .stage{display:block;padding:0}
  .story{padding:0 16px 10px}
  .story .kicker,.story h1{display:none}
  #steps{display:flex;gap:6px;max-width:none}
  #steps li{flex:1}
  #steps button{padding:0;display:block;border-radius:999px;height:6px;background:var(--line)}
  #steps .n,#steps .t{display:none}
  #steps .done{background:var(--ink)}#steps .now{background:var(--accent);box-shadow:none}
  .phone{width:100%;height:auto;min-height:calc(100dvh - 76px);border:none;border-radius:28px 28px 0 0;box-shadow:none}
  .screen{height:auto;min-height:calc(100dvh - 76px);padding:22px 18px calc(18px + env(safe-area-inset-bottom))}
  footer{background:var(--screen);padding:0 18px 18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand" aria-label="回家之前"><svg viewBox="0 0 200 200" aria-hidden="true"><rect x="8" y="8" width="184" height="184" rx="40" fill="#29251f"/><circle cx="100" cy="122" r="58" fill="#ffd98a" opacity=".16"/><path d="M100 28v26" stroke="#d8c9ae" stroke-width="3"/><path d="M68 116a32 32 0 0 0 64 0Z" fill="#fff0cc"/><path d="M100 52C66 52 44 80 41 116H159C156 80 134 52 100 52Z" fill="#a2562d"/><rect x="39" y="114" width="122" height="4.5" rx="2.2" fill="#c9a56a"/></svg><span>回家之前</span></div>
  <button class="ghost" id="restart" hidden>重新開始</button>
</header>
<main class="stage">
  <aside class="story" aria-label="流程">
    <p class="kicker">快速找風格</p>
    <h1>五個畫面，<br>從一句話到一個家</h1>
    <ol id="steps"></ol>
  </aside>
  <div class="phone"><div class="screen" id="app" aria-live="polite"></div></div>
</main>
<footer>介面與數字皆為示意，非實際產品畫面或報價。</footer>

<dialog id="unlock"><div class="dlg">
  <h2>解鎖更多方案</h2>
  <p class="lead">付費前先看得見差異（候選項目，尚未定價；此為 sandbox 示意）。</p>
  <ul><li>更多方案與修改次數</li><li>高畫質圖與多視角</li><li>下載與匯出</li><li>更細的估價明細</li><li>專業諮詢（設計師／統包）</li></ul>
  <p class="note">安全相關限制不因未付費而隱藏；付費不等於專業認證。</p>
  <div class="actions"><button class="btn" onclick="this.closest('dialog').close()">知道了</button></div>
</div></dialog>

<script type="module" src="./app.js"></script>
</body>
</html>
