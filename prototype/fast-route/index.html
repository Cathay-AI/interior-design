<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>回家之前・滑出你家的樣子</title>
<meta name="description" content="點幾張喜歡的圖，看見你家的 3D、預估花費與施工圖。">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
<style>
:root{
  --paper:#f3eee5;--surface:#fbf9f4;--card:#ece5d8;--ink:#2b2621;--muted:#7d7367;--accent:#b5653a;--accent-d:#8f4c2a;
  --green:#5f7a6a;--line:#ded5c6;
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img,svg{max-width:100%;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.note{font-size:14px;color:var(--muted);line-height:1.55}
.lead{font-size:17px;color:#5a5047;line-height:1.6}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}

/* ---------- shell ---------- */
header{position:sticky;top:0;z-index:10;background:rgba(243,238,229,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1160px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.brand svg{width:28px;height:28px}
#steps{flex:1;list-style:none;padding:0;display:flex;gap:6px;justify-content:center;min-width:0}
#steps button{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;color:var(--muted);font-size:14px;white-space:nowrap}
#steps .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--line);color:var(--ink)}
#steps .done{color:var(--ink)}#steps .done .n{background:var(--ink);color:#fff}
#steps .now{background:var(--surface);color:var(--ink);font-weight:700}#steps .now .n{background:var(--accent);color:#fff}
.ghostbtn{font-size:14px;font-weight:600;color:var(--accent-d);padding:8px 12px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
main{flex:1;width:100%;max-width:1160px;margin:0 auto;padding:clamp(20px,5vw,56px) 20px 32px;display:flex;flex-direction:column;gap:20px}
main>*{animation:in .28s ease both;min-width:0}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
footer{max-width:1160px;width:100%;margin:0 auto;padding:0 20px 20px;font-size:13px;color:var(--muted)}

.shead{display:grid;gap:8px}
.shead h1{font-size:clamp(26px,4.4vw,38px);line-height:1.25;letter-spacing:-.01em}
.back{justify-self:start;font-size:14px;color:var(--muted);padding:4px 0}
.cta{align-self:flex-start;min-width:220px;min-height:54px;padding:0 28px;border-radius:999px;background:var(--ink);color:#fff;font-size:18px;font-weight:700;transition:transform .12s,opacity .2s}
.cta:active{transform:scale(.98)}.cta:disabled{opacity:.3}
.cta.accent{background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;background:var(--card);font-size:15px;text-align:left}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip.ghost{background:none;border:1px solid var(--line);color:#5a5047}

/* 1 靈感牆（瀑布流） */
main[data-step="1"]{max-width:1500px;padding-top:16px;padding-bottom:110px}
.feed{columns:5 220px;column-gap:14px}
.feed figure{break-inside:avoid;margin:0 0 14px}
.pin{position:relative;display:block;width:100%;padding:0;border-radius:16px;overflow:hidden;background:var(--card);transition:transform .15s}
.pin img{width:100%;height:auto;transition:filter .2s}
.pin:hover img{filter:brightness(.92)}
.pin:active{transform:scale(.98)}
.pin .heart{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:rgba(251,249,244,.9);color:#b9afa2;transition:transform .18s,background .18s,color .18s}
.pin[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.pin[aria-pressed="true"] .heart{background:var(--accent);color:#fff;transform:scale(1.12)}
.feed figcaption{padding:6px 6px 0;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:baseline;white-space:nowrap;overflow:hidden}
.feed figcaption small{font-weight:400;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.feedbar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:calc(16px + env(safe-area-inset-bottom));z-index:8;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 20px;border-radius:999px;background:rgba(251,249,244,.94);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(43,38,33,.22);border:1px solid var(--line);max-width:calc(100vw - 24px)}
.feedbar .cta{min-width:0;min-height:46px;padding:0 22px;font-size:16px;position:static;margin:0;box-shadow:none;white-space:nowrap}
.feedbar .count{font-size:14px;color:#5a5047;white-space:nowrap}

/* 2 3D */
.result{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:28px;align-items:start}
.stagewrap{display:grid;gap:12px}
.scene{position:relative;aspect-ratio:4/3;max-height:calc(100dvh - 190px);width:100%;border-radius:24px;overflow:hidden;background:#ebe4d8;touch-action:none;cursor:grab}
.scene:active{cursor:grabbing}
.scene canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.scene>svg,.scene>img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hint{position:absolute;right:12px;top:12px;z-index:1;font-size:12px;color:#5a5047;background:rgba(251,249,244,.85);border-radius:999px;padding:4px 10px;pointer-events:none}
.stagebar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:6px}
.seg button{min-width:48px;height:38px;padding:0 14px;border-radius:999px;background:var(--card);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.panel{display:grid;gap:18px}
.tweak{display:grid;gap:10px}
.pricetag{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.pricetag b{font-size:28px;color:var(--accent)}
.gen{flex:1;display:grid;place-items:center;align-content:center;gap:14px;text-align:center;min-height:50dvh}
.gen .mascot{width:110px;height:110px;animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}

/* 3 估價與施工圖 */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px;align-items:start}
.cardbox{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:12px}
.big{font-size:clamp(34px,6vw,46px);font-weight:700;color:var(--accent);letter-spacing:-.01em}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:2px}
.stepper button{width:36px;height:36px;border-radius:50%;font-size:20px;background:var(--surface)}
.stepper output{min-width:4.2em;text-align:center;font-weight:600}
.items{list-style:none;padding:0;display:grid}
.items li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0}
.items li+li{border-top:1px solid var(--line)}
.items b{font-weight:600}.items .amt{font-weight:600;white-space:nowrap}
.items small{grid-column:1/-1;color:var(--muted);font-size:13px}
.items .bar{grid-column:1/-1;height:5px;border-radius:9px;background:var(--line);position:relative;overflow:hidden}
.items .bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:9px}
.sheets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheetbtn{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fdfdfb;padding:0;aspect-ratio:840/594;display:block;width:100%}
.sheetbtn svg{width:100%;height:100%}
.locked .sheetbtn svg{filter:blur(5px);transform:scale(1.04)}
.sheetbtn .tag{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:600;background:rgba(43,38,33,.82);color:#fff;border-radius:999px;padding:2px 8px}
.sheetbtn .lock{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;background:rgba(253,253,251,.25)}
.unlockrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cons{list-style:none;padding:0;display:grid;font-size:14px;color:#5a5047}
.cons li{display:flex;gap:10px;align-items:baseline;padding:6px 0}.cons i{width:9px;height:9px;border-radius:50%;flex:none}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px}

dialog{border:none;border-radius:22px;padding:0;max-width:min(92vw,420px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(43,38,33,.55)}
.dlg{padding:24px;display:grid;gap:12px}.dlg ul{padding-left:1.2em;line-height:1.8}
dialog.viewer{max-width:min(96vw,1100px);width:100%}dialog.viewer svg{width:100%;height:auto}.viewer .dlg{padding:14px}
.price{font-size:30px;font-weight:700}.price small{font-size:14px;color:var(--muted);font-weight:400}
.actions{display:flex;justify-content:flex-end;gap:10px}.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.btn{background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px;font-weight:700}

@media (max-width:820px){
  .hwrap{padding:10px 16px;gap:12px}
  #steps{gap:4px}
  #steps li{flex:1}
  #steps button{display:block;width:100%;padding:0;height:5px;background:var(--line)}
  #steps .n,#steps .t{display:none}
  #steps .done{background:var(--ink)}#steps .now{background:var(--accent)}
  main{padding:20px 16px 24px;gap:16px}
  .cta{align-self:stretch;position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 8px 24px rgba(43,38,33,.25)}
  main[data-step="1"]{padding:10px 10px 100px}
  .feed{columns:2;column-gap:10px}.feed figure{margin-bottom:10px}
  .result,.two{grid-template-columns:1fr;gap:16px}
  .scene{aspect-ratio:1;border-radius:20px}
  .sheets{grid-template-columns:repeat(2,1fr)}
  dialog.viewer{max-width:96vw}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="brand" aria-label="回家之前"><svg viewBox="0 0 200 200" aria-hidden="true"><rect x="8" y="8" width="184" height="184" rx="40" fill="#29251f"/><circle cx="100" cy="122" r="58" fill="#ffd98a" opacity=".16"/><path d="M100 28v26" stroke="#d8c9ae" stroke-width="3"/><path d="M68 116a32 32 0 0 0 64 0Z" fill="#fff0cc"/><path d="M100 52C66 52 44 80 41 116H159C156 80 134 52 100 52Z" fill="#a2562d"/><rect x="39" y="114" width="122" height="4.5" rx="2.2" fill="#c9a56a"/></svg><span>回家之前</span></div>
  <ol id="steps" aria-label="進度"></ol>
  <button class="ghostbtn" id="restart" hidden>重新開始</button>
</div></header>
<main id="app" aria-live="polite"></main>
<footer>原型：圖片為電腦算圖，金額為參考行情量級，施工圖為示意。</footer>

<dialog id="unlock"><div class="dlg">
  <h2>解鎖施工圖包</h2>
  <p class="price">NT$ 1,990 <small>示意價格</small></p>
  <ul><li>六張圖清晰可放大：平面、燈具、插座、立面、地坪</li><li>逐項估價明細表</li><li>可下載交給設計師或統包</li></ul>
  <p class="note">這是原型的模擬付款，不會扣款。圖面為示意，未經專業簽證。</p>
  <div class="actions"><button class="btn ghost" id="payCancel">先不要</button><button class="btn" id="payOk">模擬付款並解鎖</button></div>
</div></dialog>
<dialog id="viewer" class="viewer"><div class="dlg"><div id="viewerBody"></div><div class="actions"><button class="btn" onclick="this.closest('dialog').close()">關閉</button></div></div></dialog>

<script type="module" src="./app.js"></script>
</body>
</html>
