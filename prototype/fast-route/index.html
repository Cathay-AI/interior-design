<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>回家之前・快速找風格</title>
<meta name="description" content="說一句話，看見你家的樣子：3D 提案與粗略預算。">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
<style>
:root{
  --paper:#f3eee5;--surface:#fbf9f4;--card:#ece5d8;--ink:#2b2621;--muted:#7d7367;--accent:#b5653a;--accent-d:#8f4c2a;
  --green:#5f7a6a;--line:#ded5c6;
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img,svg{max-width:100%;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.note{font-size:14px;color:var(--muted);line-height:1.55}
.lead{font-size:17px;color:#5a5047;line-height:1.6}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}

/* ---------- shell ---------- */
header{position:sticky;top:0;z-index:10;background:rgba(243,238,229,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1160px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.brand svg{width:28px;height:28px}
#steps{flex:1;list-style:none;padding:0;display:flex;gap:6px;justify-content:center;min-width:0}
#steps button{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;color:var(--muted);font-size:14px;white-space:nowrap}
#steps .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--line);color:var(--ink)}
#steps .done{color:var(--ink)}#steps .done .n{background:var(--ink);color:#fff}
#steps .now{background:var(--surface);color:var(--ink);font-weight:700}#steps .now .n{background:var(--accent);color:#fff}
.ghostbtn{font-size:14px;font-weight:600;color:var(--accent-d);padding:8px 12px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
main{flex:1;width:100%;max-width:1160px;margin:0 auto;padding:clamp(20px,5vw,56px) 20px 32px;display:flex;flex-direction:column;gap:20px}
main[data-step="1"],main[data-step="2"],main[data-step="3"]{max-width:680px}
main>*{animation:in .28s ease both;min-width:0}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
footer{max-width:1160px;width:100%;margin:0 auto;padding:0 20px 20px;font-size:13px;color:var(--muted)}

.shead{display:grid;gap:8px}
.shead h1{font-size:clamp(26px,4.4vw,38px);line-height:1.25;letter-spacing:-.01em}
.back{justify-self:start;font-size:14px;color:var(--muted);padding:4px 0}
.cta{align-self:flex-start;min-width:220px;min-height:54px;padding:0 28px;border-radius:999px;background:var(--ink);color:#fff;font-size:18px;font-weight:700;transition:transform .12s,opacity .2s}
.cta:active{transform:scale(.98)}.cta:disabled{opacity:.3}
.cta.accent{background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;background:var(--card);font-size:15px;text-align:left}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip.ghost{background:none;border:1px solid var(--line);color:#5a5047}

/* 1 */
.compose{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 18px 14px;display:grid;gap:10px;box-shadow:0 10px 30px rgba(43,38,33,.06)}
.compose:focus-within{border-color:var(--accent)}
.compose textarea{width:100%;border:none;background:none;resize:none;font-size:20px;line-height:1.6;outline:none;min-height:130px}
.miclabel{font-size:14px;color:var(--muted)}
.mic{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 8px rgba(181,101,58,.16);transition:transform .15s;touch-action:none}
.mic.on{animation:pulse 1.1s infinite;transform:scale(.94)}
.mic:disabled{background:#b9afa2;box-shadow:none}
@keyframes pulse{50%{box-shadow:0 0 0 16px rgba(181,101,58,.24)}}

/* 2 */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;padding:0;background:var(--card);transition:transform .12s}
.tile img,.tile svg{width:100%;height:100%;object-fit:cover}
.tile .cap{position:absolute;left:8px;bottom:8px;font-size:13px;font-weight:600;background:rgba(251,249,244,.92);border-radius:999px;padding:4px 10px}
.tile[aria-pressed="true"]{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--accent)}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:grid;place-items:center}
.tile:active{transform:scale(.97)}
.tile.add{display:grid;place-items:center;align-content:center;gap:4px;border:2px dashed var(--accent);background:none;color:var(--accent-d);font-size:15px;cursor:pointer}
.tile.add b{font-size:28px;font-weight:400;line-height:1}
.rm{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;background:rgba(43,38,33,.75);color:#fff;font-size:18px}
.skeleton{position:absolute;inset:0;background:linear-gradient(100deg,var(--card) 40%,#f5efe4 50%,var(--card) 60%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* 3 */
.rows{display:grid;gap:10px}
.rowitem{background:var(--surface);border-radius:16px;border:1px solid var(--line)}
.rowitem.need{background:#f8e9dd;border:2px solid var(--accent)}
.rowbtn{width:100%;display:flex;align-items:center;gap:14px;padding:16px 18px;font-size:18px;text-align:left}
.rowbtn .k{color:var(--muted);min-width:3em;font-size:15px}
.rowbtn .bar{display:none}
.rowbtn .v{flex:1;font-weight:600}
.rowbtn::after{content:"修改";font-size:13px;color:var(--muted)}
.need .rowbtn .v{color:var(--accent-d)}.need .rowbtn::after{content:""}
.editor{padding:0 16px 16px;display:grid;gap:10px}
.num{display:flex;align-items:center;gap:8px;margin-top:10px}
.num input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff}

/* 4 */
.result{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:28px;align-items:start}
.stagewrap{display:grid;gap:12px}
.scene{position:relative;aspect-ratio:4/3;max-height:calc(100dvh - 190px);width:100%;border-radius:24px;overflow:hidden;background:linear-gradient(#f7f1e6,#e6dccb);touch-action:none;cursor:grab}
.scene:active{cursor:grabbing}
.scene canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.scene>svg{position:absolute;inset:0;width:100%;height:100%}
.hint{position:absolute;right:12px;top:12px;z-index:1;font-size:12px;color:#5a5047;background:rgba(251,249,244,.85);border-radius:999px;padding:4px 10px;pointer-events:none}
.abc{display:flex;justify-content:center;gap:8px}
.abc button{width:54px;height:38px;border-radius:999px;background:var(--card);font-size:16px}
.abc button[aria-pressed="true"]{background:var(--ink);color:#fff}
.panel{display:grid;gap:20px}
.tweak{display:grid;gap:10px}
.gen{flex:1;display:grid;place-items:center;align-content:center;gap:14px;text-align:center;min-height:50dvh}
.gen .mascot{width:110px;height:110px}
.genlist{list-style:none;padding:0;display:grid;gap:8px;text-align:left}
.genlist li{color:var(--muted);padding-left:26px;position:relative}
.genlist li::before{content:"";position:absolute;left:4px;top:.5em;width:10px;height:10px;border-radius:50%;background:var(--line)}
.genlist .on{color:var(--ink);font-weight:700}.genlist .on::before{background:var(--accent)}
.genlist .ok{color:var(--ink)}.genlist .ok::before{background:var(--green)}

/* 5 */
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.cardbox{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:10px}
.big{font-size:clamp(34px,6vw,46px);font-weight:700;color:var(--accent);letter-spacing:-.01em}
.big.none{font-size:26px;color:var(--ink)}
.range{position:relative;height:12px;border-radius:999px;background:#ddd5c6;margin:10px 0}
.range i{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--accent)}
.fit{font-size:15px;font-weight:600;color:var(--green)}.fit.partly{color:var(--accent-d)}.fit.over{color:var(--accent)}
.basis{margin-top:8px;font-size:14px;color:#5a5047}.basis summary{cursor:pointer;color:var(--muted)}.basis p{margin-top:6px;line-height:1.6}
.cons{list-style:none;padding:0;display:grid}
.cons li+li{border-top:1px solid var(--line)}
.cons summary{display:flex;align-items:center;gap:12px;font-size:17px;padding:12px 0;cursor:pointer;list-style:none}
.cons summary::-webkit-details-marker{display:none}
.cons i{width:12px;height:12px;border-radius:50%;flex:none}
.cons b{font-weight:600;flex:1}.cons .st{font-size:14px;color:#5a5047}
.cons details p{font-size:14px;color:#5a5047;line-height:1.6;padding:0 0 12px 24px}

dialog{border:none;border-radius:22px;padding:0;max-width:min(92vw,420px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(43,38,33,.55)}
.dlg{padding:24px;display:grid;gap:12px}.dlg ul{padding-left:1.2em;line-height:1.8}
.actions{display:flex;justify-content:flex-end}.btn{background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px;font-weight:700}

@media (max-width:820px){
  .hwrap{padding:10px 16px;gap:12px}
  #steps{gap:4px}
  #steps li{flex:1}
  #steps button{display:block;width:100%;padding:0;height:5px;background:var(--line)}
  #steps .n,#steps .t{display:none}
  #steps .done{background:var(--ink)}#steps .now{background:var(--accent)}
  main{padding:20px 16px 24px;gap:16px}
  .cta{align-self:stretch;position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));margin-top:auto;box-shadow:0 8px 24px rgba(43,38,33,.25)}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .result,.two{grid-template-columns:1fr;gap:16px}
  .scene{aspect-ratio:1;border-radius:20px}
  .panel .shead{order:-1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="brand" aria-label="回家之前"><svg viewBox="0 0 200 200" aria-hidden="true"><rect x="8" y="8" width="184" height="184" rx="40" fill="#29251f"/><circle cx="100" cy="122" r="58" fill="#ffd98a" opacity=".16"/><path d="M100 28v26" stroke="#d8c9ae" stroke-width="3"/><path d="M68 116a32 32 0 0 0 64 0Z" fill="#fff0cc"/><path d="M100 52C66 52 44 80 41 116H159C156 80 134 52 100 52Z" fill="#a2562d"/><rect x="39" y="114" width="122" height="4.5" rx="2.2" fill="#c9a56a"/></svg><span>回家之前</span></div>
  <ol id="steps" aria-label="進度"></ol>
  <button class="ghostbtn" id="restart" hidden>重新開始</button>
</div></header>
<main id="app" aria-live="polite"></main>
<footer>原型：金額為參考行情量級，限制檢查為規則示意，正式採用前需由專業覆核。</footer>

<dialog id="unlock"><div class="dlg">
  <h2>解鎖更多方案</h2>
  <p class="lead">付費前先看得見差異（候選項目，尚未定價；此為 sandbox 示意）。</p>
  <ul><li>更多方案與修改次數</li><li>高畫質圖與多視角</li><li>下載與匯出</li><li>更細的估價明細</li><li>專業諮詢（設計師／統包）</li></ul>
  <p class="note">安全相關限制不因未付費而隱藏；付費不等於專業認證。</p>
  <div class="actions"><button class="btn" onclick="this.closest('dialog').close()">知道了</button></div>
</div></dialog>

<script type="module" src="./app.js"></script>
</body>
</html>
