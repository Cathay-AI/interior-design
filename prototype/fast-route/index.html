<style>
@font-face{font-family:"GenSen Maru TW";font-weight:400;font-display:swap;src:url(assets/fonts/gensen-maru-tw-400.woff2) format("woff2")}
@font-face{font-family:"GenSen Maru TW";font-weight:700;font-display:swap;src:url(assets/fonts/gensen-maru-tw-700.woff2) format("woff2")}
/* 視覺語言：施工圖。介面退成圖紙色，房間的木色與布料是畫面上唯一的暖色；尺寸線是識別元素。
   圓角三級：4（輸入、選項、按鈕、標註）／12（右欄區塊）／24（舞台、滑卡圖片）。強調色只有捲尺黃，紅筆只給「需辦理」。 */
:root{
  --paper:#f6f6f2;--surface:#fff;--stage:#ecede8;--ink:#1e2428;--muted:#6f797e;--line:#daddd8;--yellow:#f0be28;--red:#d2402e;
  --font:"Nunito","GenSen Maru TW","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --hand:var(--font);--num:var(--font);
  --head:57px;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
img,svg{max-width:100%;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.lead{font-size:16px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.err{color:var(--red);font-size:13px}
.link{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link,.back{position:relative}.link::after,.back::after{content:"";position:absolute;inset:-12px -6px}

/* ---------- 外框：頂列 + 工作檯（左舞台、右欄） ---------- */
header{position:sticky;top:0;z-index:10;height:var(--head);background:var(--paper);border-bottom:1px solid var(--line)}
.hwrap{height:100%;padding:0 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.brand svg{width:26px;height:26px}
/* 進度：四段短線，不放步驟名稱 */
#steps{flex:1;list-style:none;padding:0;display:flex;gap:6px;justify-content:center}
#steps li{width:44px}
#steps button{display:block;width:100%;height:20px;position:relative}
#steps button::before{content:"";position:absolute;left:0;right:0;top:8px;height:4px;background:var(--line)}
#steps .done::before{background:var(--ink)}#steps .now::before{background:var(--yellow)}
#steps .n,#steps .t{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ghostbtn{font-size:13px;color:var(--muted);padding:8px 4px;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}

.bench{display:grid;grid-template-columns:62fr 38fr;height:calc(100dvh - var(--head))}
/* 舞台：同一個 canvas 全程都在。製圖紙底色加極淡的方格。 */
.stage{position:relative;min-width:0;background-color:var(--stage);
  background-image:linear-gradient(rgba(30,36,40,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(30,36,40,.04) 1px,transparent 1px);background-size:24px 24px}
.scene{position:absolute;inset:20px 20px 76px;border-radius:24px;overflow:hidden;background:var(--stage);touch-action:none;cursor:grab}
.scene:active{cursor:grabbing}.scene.flat{cursor:default;touch-action:auto}
.scene canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.scene>svg,.scene>img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene[data-ready]>img.photo{display:none}
.hint{position:absolute;right:32px;top:32px;z-index:1;font-size:12px;color:var(--muted);background:rgba(255,255,255,.85);border-radius:4px;padding:3px 8px;pointer-events:none}
.stagefoot{position:absolute;left:20px;right:20px;bottom:14px;height:52px;display:flex;align-items:flex-end;gap:20px}
/* 尺寸線：兩端短斜線的細線，中間是毫米數字 */
.dims{display:flex;gap:18px;align-items:flex-end}
.dim{display:grid;gap:3px;justify-items:center;font-weight:500;font-size:13px;font-variant-numeric:tabular-nums;line-height:1;color:var(--ink);min-width:86px}
.dim i{display:block;width:100%;height:9px;position:relative;font-style:normal;
  background:linear-gradient(var(--muted),var(--muted)) center/100% 1px no-repeat}
.dim i::before,.dim i::after{content:"";position:absolute;top:0;width:1px;height:9px;background:var(--muted);transform:rotate(35deg)}
.dim i::before{left:0}.dim i::after{right:0}
.dim small{font-family:var(--font);font-size:11px;color:var(--muted)}
.swatches{display:flex;gap:6px;margin:0 auto;align-items:flex-end}
.swatch{width:34px;height:34px;border-radius:4px;border:1px solid var(--line);overflow:hidden;display:grid;grid-template-rows:1fr 1fr;padding:0;position:relative}
.swatch i{display:block}.swatch[aria-pressed="true"]{border:2px solid var(--ink)}
.swatch[aria-pressed="true"]::after{content:"";position:absolute;left:0;top:0;border:5px solid var(--yellow);border-right-color:transparent;border-bottom-color:transparent}
.pricebox{margin-left:auto;text-align:right;line-height:1;display:grid;gap:4px;justify-items:end}
.pricebox small{font-size:12px;color:var(--muted)}
.pricebox b{font-weight:800;font-size:38px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pricebox b.flash{background:linear-gradient(transparent 62%,var(--yellow) 62%)}
.seg{position:absolute;left:32px;top:32px;z-index:1;display:flex;gap:4px;align-items:center}
.seg .note{display:none}
.seg button{min-width:44px;height:32px;padding:0 10px;border-radius:4px;background:rgba(255,255,255,.9);border:1px solid var(--line);font-size:13px}
.seg button[aria-pressed="true"]{border:2px solid var(--ink);font-weight:700}

/* 右欄：設計師的一句話、這一步的控制項、一個主要動作 */
main{min-width:0;background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;padding:28px 28px 0;display:flex;flex-direction:column;gap:18px}
main>*{min-width:0;flex:none}
main::after{content:"";flex:none;height:28px}
.shead{display:grid;gap:6px}
h1,.shead h1{font-size:32px;line-height:1.25;font-weight:700;letter-spacing:0}
h2{font-size:18px;line-height:1.4}
.back{justify-self:start;font-size:13px;color:var(--muted);padding:2px 0}
/* 主要按鈕：每個狀態只有一個，墨線底、寬度撐滿、貼在右欄底部 */
.cta{position:sticky;bottom:0;z-index:3;width:100%;min-height:52px;margin-top:auto;padding:0 20px;border-radius:4px;background:var(--ink);color:#fff;font-size:17px;font-weight:700;box-shadow:0 0 0 12px var(--surface),0 -20px 14px 6px var(--surface)}
.cta:disabled{opacity:.3}
.btn{background:var(--ink);color:#fff;border-radius:4px;padding:10px 18px;font-weight:700;font-size:14px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}
/* 選項：有邊框的方塊；選中時邊框變墨線，左上角出現捲尺黃的小角標 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;min-height:40px;padding:6px 14px;border-radius:4px;background:var(--surface);border:1px solid var(--line);font-size:15px;text-align:left;overflow:hidden}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:500}
.chip[aria-pressed="true"]::before{content:"";position:absolute;left:0;top:0;border:6px solid var(--yellow);border-right-color:transparent;border-bottom-color:transparent}
.chip.ghost{color:var(--muted)}.chip:disabled{opacity:.5;cursor:default}
.chip.yes{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700;justify-self:start}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cardbox{border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px}
/* 設計師的話：像寫在圖邊的手寫備註 */
.agent{display:flex;align-items:flex-start;gap:10px}
.agent .mascot{width:28px;height:28px;flex:none;margin-top:3px}
.bubble{display:grid;gap:8px;font-size:18px;font-weight:700;line-height:1.55}

/* 0 開場 */
.intro{display:grid;gap:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;background:var(--surface);display:grid}
.tile svg{width:100%;height:auto;aspect-ratio:4/3;background:var(--stage)}
.tile b{padding:10px 14px;font-size:18px}
.tile:hover,.tile:focus-visible{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* 1 選風格 */
.deck{position:relative;align-self:center;width:min(100%,calc((100dvh - var(--head) - 300px)*.72));aspect-ratio:18/25;touch-action:pan-y}
.card{position:absolute;inset:0;border-radius:24px;overflow:hidden;background:var(--stage);box-shadow:0 12px 32px rgba(30,36,40,.2);user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform}
.card img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.card .meta{position:absolute;left:0;right:0;bottom:0;padding:44px 18px 16px;color:#fff;background:linear-gradient(transparent,rgba(20,16,12,.72));display:grid;gap:6px}
.card .meta b{font-size:22px}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;align-items:center}.card .tags a{margin-left:auto;color:rgba(255,255,255,.75);font-size:12px}
.card.noimg{background:#8f8a80}.card.noimg img{display:none}.card .tags span{background:rgba(255,255,255,.2);border-radius:4px;padding:2px 8px}
.stamp{position:absolute;top:22px;font-size:24px;font-weight:700;padding:4px 12px;border:3px solid;border-radius:4px;opacity:0;background:rgba(255,255,255,.12)}
.stamp.like{left:18px;color:#fff;transform:rotate(-12deg)}.stamp.nope{right:18px;color:#fff;transform:rotate(12deg)}
.swipebar{display:flex;align-items:center;justify-content:center;gap:24px}
.round{width:60px;height:60px;border-radius:12px;background:var(--surface);border:1px solid var(--ink);display:grid;place-items:center;font-size:26px}
.round:active{transform:scale(.94)}.round.like{color:#fff;background:var(--ink)}
.count{font-family:var(--num);font-size:14px;color:var(--muted);min-width:3.4em;text-align:center}
#talk{min-height:64px}#skip{align-self:center}
.why{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}.why .chip{min-height:32px;padding:2px 10px;font-size:13px}

/* 2 你家的條件 */
.voice{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.voice:focus-within{border-color:var(--ink)}
.voicebody{flex:1;min-width:0;display:grid;gap:4px}
.voice textarea{width:100%;border:none;background:none;outline:none;resize:none;font-size:16px;line-height:1.5;padding:2px 0;field-sizing:content;min-height:1.5em;max-height:6em}
.mic{width:44px;height:44px;flex:none;border-radius:4px;background:var(--ink);color:#fff;display:grid;place-items:center}
.mic[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.mic:disabled{background:var(--line)}
.send{flex:none;align-self:center;min-height:44px;padding:0 14px;border-radius:4px;border:1px solid var(--ink);font-size:14px;font-weight:700}
.warn{font-size:13px;line-height:1.5;border-left:3px solid var(--yellow);padding:6px 10px;background:var(--paper)}
.meter{display:grid;gap:10px;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.meter .bar{height:6px;background:var(--line);overflow:hidden}.meter .bar i{display:block;height:100%;background:var(--yellow);transition:width .35s}
.tick{font-size:12px;padding:3px 8px;border-radius:4px;border:1px dashed var(--line);color:var(--muted)}.tick.done{border-style:solid;border-color:var(--ink);color:var(--ink);font-weight:500}
.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fields.two{grid-template-columns:repeat(2,minmax(0,10em))}.quick{display:grid;gap:8px}.more{gap:6px 18px}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted);position:relative}
.field input{width:100%;height:46px;border:1px solid var(--line);border-radius:4px;padding:0 44px 0 12px;background:#fff;font-family:var(--num);font-weight:500;font-size:19px;color:var(--ink)}
.field input:focus{border-color:var(--ink)}
.field input[aria-invalid="true"]{border-color:var(--red)}
.field em{position:absolute;right:10px;bottom:13px;font-style:normal;font-size:12px}
.ask input{width:88px;height:40px;border:1px solid var(--line);border-radius:4px;padding:0 10px;font-family:var(--num);font-size:17px;background:#fff}
.drop{display:grid;gap:4px;place-items:center;text-align:center;padding:20px 16px;border:1px dashed var(--ink);border-radius:4px;cursor:pointer}
.drop span{font-size:13px;color:var(--muted)}.drop.over{background:var(--paper)}
.docs{list-style:none;padding:0;display:grid;gap:8px}
.docs li{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:4px;padding:8px}
.docs img,.docs .pdf{width:52px;height:52px;border-radius:4px;object-fit:cover;flex:none}.docs .pdf{display:grid;place-items:center;background:var(--ink);color:#fff;font-size:12px;font-weight:700}
.docmeta{flex:1;min-width:0;display:grid;gap:6px}.docmeta b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docs .chip{min-height:30px;padding:2px 8px;font-size:13px}
.docs .rm{width:32px;height:32px;border-radius:4px;border:1px solid var(--line);font-size:18px;flex:none}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;cursor:pointer}.check input{width:20px;height:20px;accent-color:var(--ink);flex:none}
iframe.printer{position:fixed;width:0;height:0;border:0;visibility:hidden}

/* 單欄的格線一律允許欄寬縮到容器內：否則某個不能換行的子項（例如輸入框的固有寬度）會把整欄撐出畫面 */
.panel,.cardbox,.tweak,.shead,.two,.intro,.quick,.voicebody,.bubble,.meter{grid-template-columns:minmax(0,1fr)}
/* 3 你家的設計 */
.panel{display:grid;gap:18px}
.tweak{display:grid;gap:8px}
.tellrow{display:flex;gap:8px}.tell{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:4px;padding:0 12px;background:#fff;font-size:15px}
.whyso summary,.regs summary{font-size:13px;color:var(--muted);cursor:pointer;min-height:32px;display:flex;align-items:center;text-decoration:underline;text-underline-offset:3px;list-style:none}
.whyso summary::-webkit-details-marker,.regs summary::-webkit-details-marker{display:none}
.whyso ul{padding-left:1.2em;display:grid;gap:6px;font-size:14px;color:var(--muted);margin-top:4px}
.regbox{border:1px solid var(--line);border-radius:12px;overflow:hidden}.regbox.open{padding-bottom:14px}.regbox #regdetail{padding:0 14px}
.regsum{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 14px;text-align:left;font-size:15px;font-weight:500;line-height:1.45}
.regsum .dot{width:10px;height:10px;flex:none;background:var(--muted)}.regsum .dot.need{background:var(--red)}.regsum .dot.no{background:var(--ink)}
.regsum .chev{margin-left:auto;flex:none;font-size:13px;font-weight:400;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.regs{list-style:none;padding:0;display:grid}
.regs li{display:grid;grid-template-columns:4.6em 1fr;gap:12px;padding:12px 0;align-items:start}.regs li+li{border-top:1px solid var(--line)}
.regs .state{font-size:12px;font-weight:700;color:#fff;border-radius:4px;padding:2px 0;text-align:center}
.regs .brief{font-size:15px;color:var(--ink)}.regs details{margin-top:4px}
.regs p{font-size:14px;color:var(--muted);margin-top:2px}.regs small{font-size:12px;color:var(--muted)}.regs small a{color:inherit}.regs .ask{margin-top:8px}

/* 4 花費與圖 */
.two{display:grid;gap:16px}
.big{font-size:40px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.badge{justify-self:start;font-size:12px;font-weight:700;border:1px solid var(--ink);border-radius:4px;padding:2px 8px}
.stepper{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:4px;padding:2px}
.stepper button{width:36px;height:36px;border-radius:4px;font-size:20px}
.stepper output{min-width:4.2em;text-align:center;font-weight:500}
.items{list-style:none;padding:0;display:grid}
.items li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0}
.items li+li{border-top:1px solid var(--line)}
.items b{font-weight:500}.items .amt{font-family:var(--num);font-weight:600;font-size:17px;white-space:nowrap}
.items small{grid-column:1/-1;color:var(--muted);font-size:13px}
.items .bar{grid-column:1/-1;height:4px;background:var(--line);position:relative;overflow:hidden}
.items .bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.sheets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sheetbtn{position:relative;border-radius:4px;overflow:hidden;border:1px solid var(--line);background:#fdfdfb;padding:0;aspect-ratio:840/594;display:block;width:100%}
.sheetbtn svg{width:100%;height:100%}
.locked .sheetbtn svg{filter:blur(5px);transform:scale(1.04)}
.sheetbtn .tag{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:500;background:var(--ink);color:#fff;border-radius:4px;padding:1px 6px}
.sheetbtn .lock{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;background:rgba(253,253,251,.25)}
.unlockrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stages{list-style:none;padding:0;display:grid;gap:8px}
.stages li{border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.stages li.now{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--yellow)}
.stages p{grid-column:1/-1;font-size:13px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;border-radius:4px;padding:1px 8px;background:var(--yellow);color:var(--ink)}.pill.tbd{background:none;border:1px dashed var(--muted);color:var(--muted)}

dialog{margin:auto;border:none;border-radius:12px;padding:0;max-width:min(92vw,420px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(30,36,40,.55)}
.dlg{padding:24px;display:grid;gap:12px}.dlg ul{padding-left:1.2em;line-height:1.8}
dialog.viewer{max-width:min(96vw,1100px);width:100%}dialog.viewer svg{width:100%;height:auto}.viewer .dlg{padding:14px}
.price{font-family:var(--num);font-size:30px;font-weight:600}.price small{font-family:var(--font);font-size:13px;color:var(--muted);font-weight:400}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}.actions a.btn{text-decoration:none;display:inline-flex;align-items:center}

/* 手機：房間固定在上方（42dvh），右欄內容在下面捲動，主要動作貼底 */
@media (max-width:959px){
  .hwrap{padding:0 16px;gap:12px}#steps li{width:auto;flex:1;max-width:44px}
  .bench{display:block;height:auto}
  .stage{position:sticky;top:var(--head);z-index:5;height:42dvh;border-bottom:1px solid var(--line)}
  .scene{inset:0 0 0;border-radius:0}
  .stagefoot{left:12px;right:12px;bottom:8px;height:auto;gap:6px 10px;flex-wrap:wrap}
  .swatches{order:-1;flex-basis:100%;margin:0}
  .dims{gap:8px;flex:1 1 0;min-width:0}.dim{min-width:0;flex:1 1 0;max-width:64px;font-size:12px}.pricebox{flex:none}
  .stage{overflow:clip}
  .pricebox b{font-size:26px}.pricebox{background:rgba(236,237,232,.82);padding:4px 6px;border-radius:4px}
  .hint{right:10px;top:10px}.seg{left:10px;top:10px}.seg button{min-width:40px;height:30px;padding:0 8px}
  .swatch{width:28px;height:28px}
  main{border-left:none;overflow:visible;padding:18px 16px calc(96px + env(safe-area-inset-bottom));gap:14px;min-height:calc(58dvh - var(--head))}
  main::after{display:none}
  h1,.shead h1{font-size:26px}.bubble{font-size:17px}
  .cta{position:fixed;left:16px;right:16px;width:auto;bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;margin:0}
  main[data-step="1"]{padding-bottom:20px}
  .deck{width:min(100%,calc((58dvh - var(--head) - 190px)*.8));aspect-ratio:4/5}
  .round{width:52px;height:52px}#talk{min-height:0}
  dialog.viewer{max-width:96vw}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="brand" aria-label="回家之前"><svg viewBox="0 0 200 200" aria-hidden="true"><rect x="8" y="8" width="184" height="184" rx="24" fill="#1e2428"/><path d="M100 28v26" stroke="#daddd8" stroke-width="3"/><path d="M68 116a32 32 0 0 0 64 0Z" fill="#fff"/><path d="M100 52C66 52 44 80 41 116H159C156 80 134 52 100 52Z" fill="#f0be28"/></svg><span>回家之前</span></div>
  <ol id="steps" aria-label="進度"></ol>
  <button class="ghostbtn" id="restart" hidden>重新開始</button>
</div></header>
<div class="bench">
  <section class="stage" id="stage" aria-label="你的房間">
    <div class="scene" id="scene" role="img" aria-label="3D 空間，可拖曳旋轉"><img class="photo" id="poster" src="assets/preview-living.jpg" alt="" hidden></div>
    <span class="hint" id="hint">拖曳旋轉</span>
    <div class="seg" id="views" role="group" aria-label="視角"></div>
    <div class="stagefoot">
      <div class="dims" id="dims" aria-label="房間尺寸（毫米）"></div>
      <div class="swatches" id="swatches" role="group" aria-label="先試試風格" hidden></div>
      <div class="pricebox"><small id="pricekind">範例</small><b id="teaser"></b></div>
    </div>
  </section>
  <main id="app" aria-live="polite"></main>
</div>

<dialog id="unlock"><div class="dlg">
  <h2>解鎖你家尺寸的施工圖初稿</h2>
  <p class="price">NT$ 1,990 <small>示意價格</small></p>
  <ul><li>六張 AI 初稿，清晰可放大、可下載，依你填的尺寸配置</li><li>逐項估價明細表</li></ul>
  <p class="note"><b>這次解鎖的是第 1 階段的 AI 初稿，不是可以直接施工的圖。</b>專業團隊的現場丈量與確認（第 2、3 階段）流程還在確認中，目前不包含在內。這是原型的模擬付款，不會扣款。</p>
  <div class="actions"><button class="btn ghost" id="payCancel">先不要</button><button class="btn" id="payOk">模擬付款並解鎖</button></div>
</div></dialog>
<dialog id="viewer" class="viewer"><div class="dlg"><div id="viewerBody"></div><p class="note" id="viewerNote"></p><div class="actions"><a class="btn ghost" id="viewerDownload" href="#">下載 SVG</a><button class="btn ghost" id="viewerPrint" hidden>存成 PDF</button><button class="btn" onclick="this.closest('dialog').close()">關閉</button></div></div></dialog>

<script type="module" src="./app.js"></script>
</body>
</html>
