<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI 室內設計研究地圖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 首頁＝四階段圖卡＋論文卡；點卡片進入單篇圖解頁（hash 路由）。圖先、字後。 */
:root{
  --bg:#F2F4F5; --surface:#FFFFFF; --ink:#13202A; --muted:#566773; --line:#D3DBE0;
  --accent:#0B7285; --accent-soft:#DDF0F3; --accent2:#5B4FC4; --accent2-soft:#E7E4F8; --on-accent:#FFFFFF;
  --good:#2B8A3E; --bad:#C92A2A;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F171D; --surface:#17222B; --ink:#E6EDF1; --muted:#93A4B0; --line:#2A3945;
    --accent:#4FC1D4; --accent-soft:#12323A; --accent2:#A79BFF; --accent2-soft:#26214A; --on-accent:#0F171D;
    --good:#69DB7C; --bad:#FF8787; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F171D; --surface:#17222B; --ink:#E6EDF1; --muted:#93A4B0; --line:#2A3945;
  --accent:#4FC1D4; --accent-soft:#12323A; --accent2:#A79BFF; --accent2-soft:#26214A; --on-accent:#0F171D;
  --good:#69DB7C; --bad:#FF8787; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7;
  padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
h1,h2,h3{line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,6vw,36px);font-weight:700}
h2{font-size:20px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lead{font-size:17px;color:var(--muted)}
.hint,.note{font-size:13.5px;color:var(--muted)}
header,section{display:flex;flex-direction:column;gap:14px}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* home stage cards */
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stage{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-decoration:none;color:var(--ink)}
.stage:hover{border-color:var(--accent)}
.stage svg{width:100%;height:auto;aspect-ratio:16/9;max-width:100%;background:var(--accent-soft);border-radius:8px}
.stage .n{font-family:var(--font-mono);font-size:11px;color:var(--accent)}
.stage b{font-size:15px;line-height:1.3}
.stage small{color:var(--muted);font-size:13px;line-height:1.45}

.group{scroll-margin-top:16px}
.ghead{display:flex;gap:10px;align-items:center}
.ghead .gi{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ghead div{display:flex;flex-direction:column}
.ghead .k{color:var(--muted);font-size:14.5px;line-height:1.5}
.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cards li{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.cards li:hover{border-color:var(--accent)}
.card{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.card .nm{font-weight:700}
.card .ky{grid-column:2;color:var(--muted);font-size:14px;line-height:1.55}
.orig{flex:none;display:flex;align-items:center;padding:0 12px;border-left:1px solid var(--line);font-size:12.5px;font-family:var(--font-mono);text-decoration:none;white-space:nowrap}
.orig:hover{background:var(--accent-soft)}
.tag{font-family:var(--font-mono);font-size:11px;padding:2px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);height:fit-content;white-space:nowrap;margin-top:3px}
.tag.core{background:var(--accent);color:var(--on-accent)}

/* detail */
.crumbs{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px}
.crumbs a{text-decoration:none}
.dhead{display:flex;flex-direction:column;gap:10px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.key{font-size:clamp(18px,4vw,21px);font-weight:500;line-height:1.55;border-left:4px solid var(--accent);padding-left:14px}
.plain{display:flex;gap:10px;align-items:flex-start;background:var(--accent2-soft);border-radius:10px;padding:12px 14px;font-size:15.5px}
.plain .ic{color:var(--accent2);margin-top:2px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:15px;text-decoration:none;font-weight:500;border:1px solid var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{color:var(--accent)}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.fig .cap{font-size:13px;color:var(--muted)}
.fig svg.dg{width:100%;height:auto;max-width:100%}
.scrollx{overflow-x:auto;max-width:100%;min-width:0}
@media (max-width:520px){
  .scrollx svg.dg{min-width:440px}
  .steps{flex-direction:column;gap:2px}
  .step{flex-direction:row;width:auto;text-align:left;gap:12px;font-size:14.5px}
  .step .bub{width:42px;height:42px}
  .arr{margin:0 0 0 14px;align-self:flex-start;transform:rotate(90deg)}
}

/* icon flow */
.steps{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;width:92px;text-align:center;font-size:13px;line-height:1.35}
.step .bub{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.step.last .bub{background:var(--accent2);color:var(--on-accent)}
.step .bub .ic{width:26px;height:26px}
.arr{align-self:flex-start;margin-top:16px;color:var(--muted);font-family:var(--font-mono)}

/* svg diagram tokens */
.s-box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.s-acc{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.s-acc2{fill:var(--accent2-soft);stroke:var(--accent2);stroke-width:1.5}
.s-fill{fill:var(--accent)}
.s-fill2{fill:var(--accent2)}
.s-soft{fill:var(--accent-soft)}
.s-t{fill:var(--ink);font-size:14px;font-family:var(--font-body)}
.s-tb{fill:var(--ink);font-size:14px;font-weight:700;font-family:var(--font-body)}
.s-m{fill:var(--muted);font-size:12px;font-family:var(--font-body)}
.s-on{fill:var(--on-accent);font-size:13px;font-family:var(--font-body)}
.s-ln{stroke:var(--muted);stroke-width:1.5;fill:none}
.s-lna{stroke:var(--accent);stroke-width:2;fill:none}
.s-mk{fill:var(--muted)}
.s-good{fill:var(--good);font-size:14px;font-weight:700;font-family:var(--font-body)}
.s-bad{fill:var(--bad);font-size:14px;font-weight:700;font-family:var(--font-body)}
.s-furn{fill:var(--accent2-soft);stroke:var(--accent2);stroke-width:1.2}

/* bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,140px) 1fr;gap:10px;align-items:center;font-size:14px}
.bar .tr{position:relative;height:26px;background:var(--accent-soft);border-radius:6px;overflow:visible}
.bar .fl{height:100%;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:var(--on-accent);font-family:var(--font-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.bar .fl.alt{background:var(--accent2)}
.bar .ref{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--muted)}

/* vote / spectrum */
.vote{display:flex;height:30px;border-radius:6px;overflow:hidden;font-size:12.5px;font-family:var(--font-mono)}
.vote div{display:flex;align-items:center;justify-content:center;color:var(--on-accent)}
.spec{position:relative;height:34px;border-radius:17px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.spec span{position:absolute;top:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:var(--surface);border:2px solid var(--ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vs > div{display:flex;flex-direction:column;gap:8px;min-width:0}
.vs .lb{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;background:var(--accent-soft);border-radius:6px;padding:4px 8px}
@media (max-width:520px){.vs{grid-template-columns:1fr}}

/* quad (eval overview) */
.quad{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.quad div{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.quad .h{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--accent)}
.quad .p{color:var(--good)} .quad .c{color:var(--bad)}

/* trio */
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.trio div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.trio .lb{display:flex;gap:6px;align-items:center;font-weight:700;font-size:14px;color:var(--accent)}
.trio ul{margin:0;padding-left:18px;font-size:14.5px;line-height:1.6}
.stat{display:flex;flex-wrap:wrap;gap:10px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;color:var(--accent)}
.stat span{font-size:13px;color:var(--muted)}
.use{display:flex;gap:10px;align-items:flex-start;border:1px dashed var(--accent2);border-radius:10px;padding:12px 14px;font-size:15px}
.use .ic{color:var(--accent2);margin-top:2px}
.pn{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;border-top:1px solid var(--line);padding-top:16px}
.pn a{text-decoration:none;max-width:48%}
.prio{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.prio div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.prio ul{margin:0;padding-left:18px;font-size:15px}
/* before / after */
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.ba > div{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0;font-size:15.5px;line-height:1.55}
.ba .old{background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.ba .new{background:var(--accent-soft);border:1px solid var(--accent)}
.ba .lb{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;font-weight:700}
.ba .old .lb{color:var(--bad)} .ba .new .lb{color:var(--accent)}
.ba .to{align-self:center;color:var(--accent);font-size:22px;padding:0}
@media (max-width:520px){.ba{grid-template-columns:1fr}.ba .to{transform:rotate(90deg);justify-self:center}}
/* glossary */
.gloss{display:none!important;flex-direction:column;gap:8px}
.gloss .lb{font-size:13.5px;color:var(--muted)}
.gl{display:flex;flex-wrap:wrap;gap:8px}
.gl details{background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:14px}
.gl summary{cursor:pointer;padding:5px 10px;list-style:none;color:var(--accent);font-weight:500}
.gl summary::-webkit-details-marker{display:none}
.gl summary::after{content:" ＋";color:var(--muted)}
.gl details[open]{flex-basis:100%}
.gl details[open] summary::after{content:" －"}
.gl details p{padding:0 10px 8px;line-height:1.6}
/* tech map */
.tech{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tech > div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.tech .h{display:flex;gap:8px;align-items:center;font-weight:700}
.tech .h .ic{color:var(--accent)}
.tech .d{font-size:14px;color:var(--muted);line-height:1.5}
.tech .u{font-size:12.5px;font-family:var(--font-mono);color:var(--accent2)}
/* code / chat figures */
pre.code{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--font-mono);font-size:12.5px;line-height:1.7;overflow-x:auto;color:var(--ink)}
pre.code b{color:var(--accent2)}
.codefig{display:grid;grid-template-columns:1fr;gap:12px;justify-items:center}
.codefig pre{justify-self:stretch}
.codefig svg.dg{max-width:340px}
.codefig > *{min-width:0}
@media(max-width:600px){.codefig{grid-template-columns:1fr}}
.chat{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:85%;padding:8px 12px;border-radius:12px;font-size:14.5px;line-height:1.5}
.bubble.u{align-self:flex-end;background:var(--accent);color:var(--on-accent)}
.bubble.a{align-self:flex-start;background:var(--accent2-soft)}
/* stars, trend, ctx, rubric */
.stars{color:#E8A317;letter-spacing:1px;font-size:14px;white-space:nowrap}
.stars .off{color:var(--line)}
.card .mt{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--muted);font-family:var(--font-mono)}
.rating{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13.5px;color:var(--muted)}
.rating .stars{font-size:20px}
.rlink{font-size:13px}
.trend{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.trend .lb{font-family:var(--font-mono);font-size:12px;color:var(--accent2);letter-spacing:.06em}
.trend p{font-size:14.5px}
.tl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tl a{display:inline-flex;gap:6px;align-items:baseline;font-size:13px;text-decoration:none;background:var(--accent-soft);border-radius:6px;padding:3px 8px;color:var(--ink)}
.tl a i{font-style:normal;font-family:var(--font-mono);font-size:11.5px;color:var(--accent)}
.tla{color:var(--muted);font-size:12px}
.ctx{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:center}
.ctx .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctx .cl{font-size:12px;color:var(--muted);text-align:center;font-family:var(--font-mono)}
.ctx .ca{color:var(--accent);font-size:20px}
.cn{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.4}
.cn b{font-size:14px}
.cn i{font-style:normal;font-family:var(--font-mono);font-size:11.5px;color:var(--accent)}
.cn span{font-size:12.5px;color:var(--muted)}
a.cn:hover{border-color:var(--accent)}
.cn.ext{border-style:dashed;background:transparent}
.cn.me{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cn.me i,.cn.me span{color:var(--on-accent);opacity:.85}
@media (max-width:600px){.ctx{grid-template-columns:1fr}.ctx .ca{transform:rotate(90deg);justify-self:center}.ctx .cl{text-align:left}}
h2 .no{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:14px;font-family:var(--font-mono);margin-right:8px;vertical-align:2px}
.ba ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.mth,.res{margin:0;padding-left:20px;font-size:15px;line-height:1.7}
.rubric{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.rubric summary{cursor:pointer;padding:12px 14px;display:flex;gap:8px;align-items:center;font-weight:700;color:var(--accent);list-style:none}
.rubric summary::-webkit-details-marker{display:none}
.rubric summary .ic{width:18px;height:18px}
.rb{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.rbg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.rbg div{display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:var(--muted)}
.rbg b{color:var(--ink);font-size:14px}
.archive{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:4px 12px}
.archive summary{cursor:pointer;padding:10px 2px;display:flex;gap:8px;align-items:center;color:var(--muted);font-weight:500;list-style:none}
.archive summary::-webkit-details-marker{display:none}
.archive .cards{padding-bottom:12px}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dots span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-size:13px;border:2px solid var(--accent);color:var(--accent)}
.dots span.on{background:var(--accent);color:var(--on-accent)}
@media (max-width:520px){
  .steps .step{flex-direction:row;width:auto;text-align:left;gap:12px;font-size:14.5px}
  .steps .step .bub{width:40px;height:40px}
  .steps .arr{margin:0 0 0 13px}
}
.rcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.rcard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:14px;text-decoration:none;color:var(--ink)}
.rcard .gi{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.rcard b{font-size:16px}.rcard small{color:var(--muted);font-size:13.5px;line-height:1.5}
.rcard .go{margin-top:auto;font-size:13.5px;color:var(--accent);font-weight:500}
.rcard.pend{border-style:dashed;border-color:var(--line);opacity:.75}.rcard.pend .go{color:var(--muted)}
a.rcard:hover{background:var(--accent-soft)}
.toc{display:flex;flex-wrap:wrap;gap:8px}
.toc a{display:inline-flex;align-items:center;gap:6px;font-size:14px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 12px 4px 4px;color:var(--ink)}
.toc .no,.rsec .no{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:12.5px;font-family:var(--font-mono)}
.rsec{scroll-margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;gap:12px}
.rsec h2 .no{margin-right:8px;vertical-align:2px}
.rkey{font-size:16px;font-weight:500;border-left:4px solid var(--accent2);padding-left:12px;line-height:1.6}
.tl.big{gap:8px}
.tl.big a{flex-direction:column;align-items:flex-start;gap:0;padding:8px 10px;font-size:14px;font-weight:500}
.tl.big a span{font-size:12px;color:var(--muted);font-weight:400}

function hbars(rows, opt={}){ // rows: [label, value, href?, sub?]
  const max = Math.max(...rows.map(r=>r[1]),1);
  return `<div class="hb">${rows.map(r=>`<${r[2]?`a href="${r[2]}"${/^http/.test(r[2])?' target="_blank" rel="noopener"':""}`:"div"} class="hbr${r[4]?" hl":""}"><span class="hbl">${r[0]}</span><span class="hbt"><i style="width:${Math.max(2,r[1]/max*100)}%"></i></span><span class="hbv">${opt.fmt?opt.fmt(r[1]):r[1]}${r[3]?`<small>${r[3]}</small>`:""}</span></${r[2]?"a":"div"}>`).join("")}</div>`;
}
function vbars(rows, hlFrom){ // [label, value]
  const max = Math.max(...rows.map(r=>r[1]),1), W=rows.length*44, H=150;
  return `<div class="scroll"><svg class="vb" viewBox="0 0 ${W} ${H+34}" role="img" aria-label="長條圖">${rows.map((r,i)=>{const h=Math.max(2,r[1]/max*H), x=i*44+6;
    return `<rect x="${x}" y="${H-h+14}" width="32" height="${h}" rx="3" class="${hlFrom&&/^\d/.test(r[0])&&r[0]>=hlFrom?"vb-hl":"vb-n"}"/><text x="${x+16}" y="${H-h+9}" class="vb-v">${r[1]}</text><text x="${x+16}" y="${H+30}" class="vb-l">${r[0]}</text>`;}).join("")}</svg></div>`;
}

function clipLists(){
  app.querySelectorAll("ul.cards").forEach(ul=>{
    const items=[...ul.children]; if(items.length<=4) return;
    items.slice(3).forEach(li=>li.classList.add("clipped"));
    const b=document.createElement("button"); b.className="tb more-btn"; b.textContent=`顯示全部 ${items.length} 篇`;
    b.addEventListener("click",()=>{ items.forEach(li=>li.classList.remove("clipped")); b.remove(); });
    ul.after(b);
  });
  app.querySelectorAll("table.rt.oss tbody").forEach(tb=>{
    const rows=[...tb.children]; if(rows.length<=5) return;
    rows.slice(4).forEach(r=>r.classList.add("clipped"));
    const b=document.createElement("button"); b.className="tb more-btn"; b.textContent=`顯示全部 ${rows.length} 個`;
    b.addEventListener("click",()=>{ rows.forEach(r=>r.classList.remove("clipped")); b.remove(); });
    tb.closest(".scroll").after(b);
  });
}
function route(){
  const h = location.hash.slice(1);
  renderNav(h);
  if (h==="research") { researchHub(); window.scrollTo(0,0); return; }
  if (h==="") { hub(); window.scrollTo(0,0); return; }
  if (h==="oss") { ossView(); clipLists(); window.scrollTo(0,0); return; }
  if (h==="product") { productView(); window.scrollTo(0,0); return; }
  if (h==="data") { dataView(); window.scrollTo(0,0); return; }
  if (h==="radar") { radarView(); window.scrollTo(0,0); return; }
  if (h.startsWith("c-") && compById[h.slice(2)]) { compView(compById[h.slice(2)]); window.scrollTo(0,0); return; }
  if (h.startsWith("r-") && REPORTS[h.slice(2)]) { reportView(h.slice(2)); window.scrollTo(0,0); return; }
  if (h.startsWith("p-") && byId[h.slice(2)]) { detail(byId[h.slice(2)]); window.scrollTo(0,0); return; }
  home(); clipLists();
  if (h.startsWith("g-")) { const el = document.getElementById(h); if (el) window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - 120); }
  else window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
